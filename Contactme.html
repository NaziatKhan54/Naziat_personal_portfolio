<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="Contactme.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>My portfolio</title>
    <style>
    </style>
</head>

<body>
    <div class="background-ellipses-container">
        <div class="background-ellipses">
            <div class="ellipse1"></div>
            <div class="ellipse2"></div>
            <div class="ellipse3"></div>
            <div class="ellipse4"></div>
            <div class="ellipse5"></div>
            <div class="ellipse6"></div>
        </div>

    </div>
    <div class="container">
        <nav class="navbar">
            <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="nav-menu" id="nav-menu">
                <a href="index.html" class="nav-item">Home</a>
                <a href="Aboutme.html" class="nav-item">About</a>
                <a href="ProjectsPg.html" class="nav-item ">Projects</a>
                <a href="Achievements.html" class="nav-item ">Achievements</a>
                <a href="Contactme.html" class="nav-item active">Contact</a>
            </div>
        </nav>
        <main class="container">

            <section class="contact-section">

            </section>

            <section class="contact-container">

                <!-- Contact Info Panel -->
                <div class="contact-info">
                    <h3>Contact Information</h3>
                    <p class="info-desc">Feel free to reach out to me directly through any of these platforms.</p>

                    <div class="info-list">
                        <div class="info-item">
                            <div class="info-icon"><i class="fa-solid fa-envelope"></i></div>
                            <div>
                                <span>Email</span>
                                <p>khannaziat54@gmail.com</p>
                            </div>
                        </div>

                        <div class="info-item">
                            <div class="info-icon"><i class="fa-solid fa-location-dot"></i></div>
                            <div>
                                <span>Location</span>
                                <p>Halishahar, Chittagong, Bangladesh</p>
                            </div>
                        </div>
                    </div>

                    <div class="social-icons">
                        <a href="https://www.facebook.com" target="_blank" class="icon-link facebook"
                            title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                        <a href="https://github.com/NaziatKhan54" target="_blank" class="icon-link github"
                            title="GitHub"><i class="fa-brands fa-github"></i></a>
                        <a href="https://www.linkedin.com/" target="_blank" class="icon-link linkedin"
                            title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
                        <a href="mailto:khannaziat54@gmail.com" class="icon-link gmail" title="Gmail"><i
                                class="fa-solid fa-envelope"></i></a>
                    </div>
                </div>

                <form action="https://formsubmit.co/khannaziat54@gmail.com" method="POST" class="contact-form">

                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_subject" value="New Portfolio Contact Message!">
                    <input type="hidden" name="_template" value="table">

                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" placeholder="Karim Uddin" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" placeholder="Project Collaboration" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Your Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Write your message here..."
                            required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span>Send Message</span>
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>

            </section>
        </main>
    </div>
    <script>
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const navMenu = document.getElementById('nav-menu');
        const hamburgerIcon = hamburgerBtn.querySelector('i');
        hamburgerBtn.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            if (navMenu.classList.contains('active')) {
                hamburgerIcon.classList.remove('fa-bars');
                hamburgerIcon.classList.add('fa-xmark');
            } else {
                hamburgerIcon.classList.remove('fa-xmark');
                hamburgerIcon.classList.add('fa-bars');
            }
        });
    </script>
</body>

</html>
